name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (optional)"
        required: false
        type: choice
        default: "latest"
        options:
          - "latest"
          - "previous"
          - "beta"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        cds-version: [latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i -g @sap/cds-dk@${{ matrix.cds-version }}
      - run: npm i
      - run: npm run test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npmjs:@cap-js/data-privacy
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm i
      - name: Get Version
        id: get-version
        run: |
          echo "version=$(npm pkg get version | tr -d '"')" >> $GITHUB_OUTPUT
      - name: Parse changelog
        id: parse-changelog
        uses: schwma/parse-changelog-action@1c2b2005ccf594cc3a45d33c10af4ab924d3a1c5 # v1.2.0
        with:
          version: "${{ steps.get-version.outputs.version }}"
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: "v${{ steps.get-version.outputs.version }}"
          body: "${{ steps.parse-changelog.outputs.body }}"
      - run: npm publish --access public --provenance --tag ${{ github.event.inputs.tag }}
