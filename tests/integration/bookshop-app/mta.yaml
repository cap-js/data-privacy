_schema-version: '3.1'
ID: capire.gdpr
version: 1.0.0
description: gdpr
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx -p @sap/cds-dk cds build --production
modules:
  - name: gdpr-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: gdpr-db
      - name: gdpr-auth
      - name: gdpr-cf-logging
      - name: gdpr-auditlog
      - name: gdpr-information
      - name: gdpr-retention
  - name: gdpr-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: gdpr-db
      - name: gdpr-auth
      - name: gdpr-cf-logging
resources:
  - name: gdpr-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: gdpr-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: gdpr-${org}-${space}
        tenant-mode: dedicated
        scopes:
          - name: $XSAPPNAME.PersonalDataManagerUser
            description: Technial scope to restrict access to information endpoint
            grant-as-authority-to-apps:
              - $XSSERVICENAME(gdpr-information)
          - name: $XSAPPNAME.DataRetentionManagerUser
            description: Technial scope to restrict access to retention endpoint
            grant-as-authority-to-apps:
              - $XSSERVICENAME(gdpr-retention)
  - name: gdpr-cf-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
  - name: gdpr-information
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service-name: gdpr-information
      service: data-privacy-integration-service
      service-plan: data-privacy-internal
      config:
        xs-security:
          xsappname: gdpr-information-${org}-${space}
          authorities:
            - $ACCEPT_GRANTED_AUTHORITIES
        dataPrivacyConfiguration:
          configType: information
          applicationConfiguration:
            applicationName: gdpr-information
            applicationTitle: gdpr
            enableAutoSubscription: true
          informationConfiguration:
            applicationConfiguration:
              dataSubjectDeletionAgent: retention-manager
              retentionApplicationName: gdpr-retention
              disableDataSubjectCorrection: true
              cacheControl: no-cache
            components:
              - componentName: gdpr-srv
                componentBaseURL: ~{srv-api/srv-url}
                serviceEndPoints:
                  - serviceName: gdpr-service
                    serviceFormat: odata-v4
                    annotationFormat: v4
                    serviceEndPoint: /pdm
                    appPaginationEnabled: true
                    cacheControl: no-cache
  - name: gdpr-retention
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service-name: gdpr-retention
      service: data-privacy-integration-service
      service-plan: data-privacy-internal
      config:
        xs-security:
          xsappname: gdpr-retention-${org}-${space}
          authorities:
            - $ACCEPT_GRANTED_AUTHORITIES
        dataPrivacyConfiguration:
          configType: retention
          applicationConfiguration:
            applicationName: gdpr-retention
            applicationDescription: gdpr-retention
            applicationBaseURL: ~{srv-api/srv-url}
            applicationTitle: gdpr
            enableAutoSubscription: true
          translationConfiguration:
            textBundleBaseURL: ~{srv-api/srv-url}
            textBundleEndPoint: /data-privacy-i18n
            defaultLanguage: en
            supportedLanguages:
              - de
              - fr
              - es
              - en
          retentionConfiguration:
            applicationConfiguration:
              applicationType: TransactionMaster
              simulationSupportedForArchiving: true
              simulationSupportedForDestruction: true
              iLMObjectDiscoveryEndPoint: /drm/iLMObjects
            dataSubjectRoles:
              - dataSubjectRoleName: Customer
                dataSubjectDescription: Customer
                dataSubjectBaseURL: ~{srv-api/srv-url}
                dataSubjectBlockingEndPoint: /drm/dataSubjectBlocking
                dataSubjectInformationEndPoint: /drm/dataSubjectInformation
                dataSubjectsDestroyingEndPoint: /drm/dataSubjectsDestroying
            organizationAttributes:
              - organizationAttributeName: legalEntity_title
                organizationAttributeDescription: Legal entity
                organizationAttributeBaseURL: ~{srv-api/srv-url}
                organizationAttributeValueHelpEndPoint: /drm/valueHelp_orgAttribute_sap_capire_bookshop_LegalEntities
  - name: gdpr-auditlog
    type: org.cloudfoundry.managed-service
    parameters:
      service: auditlog
      service-plan: standard
