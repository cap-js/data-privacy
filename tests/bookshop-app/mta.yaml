_schema-version: "3.1"
ID: capire.gdpr
version: 1.0.0
description: bookshop
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm unlink @sap/cds-dpi
        - npm pack ../../
        - npm install sap-cds-dpi-1.0.0.tgz
        - npm ci
        - npx -p @sap/cds-dk cds build --production
        - cp sap-cds-dpi-1.0.0.tgz ./gen/srv
  after-all:
    - builder: custom
      commands:
        - npm link ../../
        - rm -rf ./node_modules/@sap/cds
modules:
  - name: bookshop-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: bookshop-db
      - name: bookshop-auth
      - name: bookshop-cf-logging
      - name: bookshop-auditlog
      - name: bookshop-information
      - name: bookshop-retention
  - name: bookshop-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: bookshop-db
      - name: bookshop-auth
      - name: bookshop-cf-logging
resources:
  - name: bookshop-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: bookshop-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: bookshop-${org}-${space}
        tenant-mode: dedicated
        scopes:
          - name: $XSAPPNAME.PersonalDataManagerUser
            description: Technial scope to restrict access to information endpoint
            grant-as-authority-to-apps:
              - $XSSERVICENAME(bookshop-information)
          - name: $XSAPPNAME.DataRetentionManagerUser
            description: Technial scope to restrict access to retention endpoint
            grant-as-authority-to-apps:
              - $XSSERVICENAME(bookshop-retention)
  - name: bookshop-cf-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
  - name: bookshop-information
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service-name: bookshop-information
      service: data-privacy-integration-service
      service-plan: data-privacy-internal
      config:
        xs-security:
          xsappname: bookshop-information-${org}-${space}
          authorities:
            - $ACCEPT_GRANTED_AUTHORITIES
        dataPrivacyConfiguration:
          configType: information
          applicationConfiguration:
            applicationName: bookshop-information
            applicationTitle: bookshop
            enableAutoSubscription: true
          informationConfiguration:
            applicationConfiguration:
              dataSubjectDeletionAgent: retention-manager
              retentionApplicationName: bookshop-retention
              disableDataSubjectCorrection: true
              cacheControl: no-cache
            components:
              - componentName: bookshop-srv
                componentBaseURL: ~{srv-api/srv-url}
                serviceEndPoints:
                  - serviceName: bookshop-service
                    serviceFormat: odata-v4
                    annotationFormat: v4
                    serviceEndPoint: /pdm
                    appPaginationEnabled: true
                    cacheControl: no-cache
  - name: bookshop-retention
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service-name: bookshop-retention
      service: data-privacy-integration-service
      service-plan: data-privacy-internal
      config:
        xs-security:
          xsappname: bookshop-retention-${org}-${space}
          authorities:
            - $ACCEPT_GRANTED_AUTHORITIES
        dataPrivacyConfiguration:
          configType: retention
          applicationConfiguration:
            applicationName: bookshop-retention
            applicationDescription: bookshop-retention
            applicationDescriptionKey: APPLICATION_NAME
            applicationBaseURL: ~{srv-api/srv-url}
            applicationTitle: bookshop
            enableAutoSubscription: true
          translationConfiguration:
            textBundleEndPoint: /drm/i18n-files/i18n.properties
            defaultLanguage: en
            supportedLanguages:
              - de
              - fr
              - es
              - en
          retentionConfiguration:
            applicationConfiguration:
              applicationType: TransactionMaster
              iLMObjectDiscoveryEndPoint: /drm/iLMObjects
            dataSubjectRoles:
              - dataSubjectRoleName: Customer
                dataSubjectDescription:
                  kind: entity
                  "@Core.Description": Customer
                  "@PersonalData.DataSubjectRole": Customer
                  "@PersonalData.EntitySemantics": DataSubject
                  "@Communication.Contact.n.surname":
                    =: lastName
                  "@Communication.Contact.n.given":
                    =: firstName
                  "@Communication.Contact.bday":
                    =: dateOfBirth
                  "@Communication.Contact.email":
                    - address:
                        =: email
                      type:
                        "#": preferred
                  "@Communication.Contact.gender":
                    =: gender
                  "@AuditLog.Operation.Read": true
                  "@AuditLog.Operation.Insert": true
                  "@AuditLog.Operation.Update": true
                  "@AuditLog.Operation.Delete": true
                  elements:
                    - "@PersonalData.FieldSemantics": DataSubjectID
                      key: true
                      type: cds.UUID
                    - "@cds.on.insert":
                        =: $now
                      "@UI.HiddenFilter": true
                      "@UI.ExcludeFromNavigationContext": true
                      "@Core.Immutable": true
                      "@title": "{i18n>CreatedAt}"
                      "@readonly": true
                      type: cds.Timestamp
                      "@Core.Computed": true
                      "@Common.Label": "{i18n>CreatedAt}"
                    - "@cds.on.insert":
                        =: $user
                      "@UI.HiddenFilter": true
                      "@UI.ExcludeFromNavigationContext": true
                      "@Core.Immutable": true
                      "@title": "{i18n>CreatedBy}"
                      "@readonly": true
                      "@description": "{i18n>UserID.Description}"
                      type: cds.String
                      length: 255
                      "@Core.Computed": true
                      "@Common.Label": "{i18n>CreatedBy}"
                      "@Core.Description": "{i18n>UserID.Description}"
                    - "@cds.on.insert":
                        =: $now
                      "@cds.on.update":
                        =: $now
                      "@UI.HiddenFilter": true
                      "@UI.ExcludeFromNavigationContext": true
                      "@title": "{i18n>ChangedAt}"
                      "@readonly": true
                      type: cds.Timestamp
                      "@Core.Computed": true
                      "@Common.Label": "{i18n>ChangedAt}"
                    - "@cds.on.insert":
                        =: $user
                      "@cds.on.update":
                        =: $user
                      "@UI.HiddenFilter": true
                      "@UI.ExcludeFromNavigationContext": true
                      "@title": "{i18n>ChangedBy}"
                      "@readonly": true
                      "@description": "{i18n>UserID.Description}"
                      type: cds.String
                      length: 255
                      "@Core.Computed": true
                      "@Common.Label": "{i18n>ChangedBy}"
                      "@Core.Description": "{i18n>UserID.Description}"
                    - "@title": Email
                      "@PersonalData.IsPotentiallyPersonal": true
                      type: cds.String
                      "@Communication.IsEmailAddress": true
                      "@ILM.ValueHelp.Path": /drm/valueHelp_selection_DPIRetentionService_Customers_email
                      "@ILM.ValueHelp.Type": selection
                      "@ILM.ValueHelp.Entity": DPIRetentionService.valueHelp_selection_DPIRetentionService_Customers_email
                      "@Common.Label": Email
                    - "@title": First name
                      "@PersonalData.IsPotentiallyPersonal": true
                      type: cds.String
                      "@ILM.ValueHelp.Path": /drm/valueHelp_selection_DPIRetentionService_Customers_firstName
                      "@ILM.ValueHelp.Type": selection
                      "@ILM.ValueHelp.Entity": DPIRetentionService.valueHelp_selection_DPIRetentionService_Customers_firstName
                      "@Common.Label": First name
                    - "@title": Last name
                      "@PersonalData.IsPotentiallyPersonal": true
                      type: cds.String
                      "@ILM.ValueHelp.Path": /drm/valueHelp_selection_DPIRetentionService_Customers_lastName
                      "@ILM.ValueHelp.Type": selection
                      "@ILM.ValueHelp.Entity": DPIRetentionService.valueHelp_selection_DPIRetentionService_Customers_lastName
                      "@Common.Label": Last name
                    - "@title": Gender
                      type: cds.String
                      "@PersonalData.IsPotentiallySensitive": true
                      "@ILM.ValueHelp.Path": /drm/valueHelp_selection_DPIRetentionService_Customers_gender
                      "@ILM.ValueHelp.Type": selection
                      "@ILM.ValueHelp.Entity": DPIRetentionService.valueHelp_selection_DPIRetentionService_Customers_gender
                      "@Common.Label": Gender
                    - "@title": Date of birth
                      "@PersonalData.IsPotentiallyPersonal": true
                      type: cds.Date
                      "@PersonalData.IsPotentiallySensitive": true
                      "@ILM.ValueHelp.Path": /drm/valueHelp_selection_DPIRetentionService_Customers_dateOfBirth
                      "@ILM.ValueHelp.Type": selection
                      "@ILM.ValueHelp.Entity": DPIRetentionService.valueHelp_selection_DPIRetentionService_Customers_dateOfBirth
                      "@Common.Label": Date of birth
                    - "@title": Postal address
                      type: cds.Composition
                      cardinality:
                        max: 1
                      target: DPIRetentionService.CustomerPostalAddress
                      on:
                        - ref:
                            - postalAddress
                            - Customer
                        - =
                        - ref:
                            - $self
                      "@Common.Label": Postal address
                    - "@title": Billing data
                      type: cds.Composition
                      cardinality:
                        max: 1
                      target: DPIRetentionService.CustomerBillingData
                      on:
                        - ref:
                            - billingData
                            - Customer
                        - =
                        - ref:
                            - $self
                      "@Common.Label": Billing data
                    - "@UI.HiddenFilter": true
                      "@PersonalData.FieldSemantics": BlockingDate
                      type: cds.Date
                    - "@UI.HiddenFilter": true
                      "@PersonalData.FieldSemantics": EndOfRetentionDate
                      type: cds.Date
                    - "@PersonalData.FieldSemantics": EndOfBusinessDate
                      type: cds.Date
                    - key: true
                      type: cds.String
                      "@title": Legal entity
                      "@PersonalData.FieldSemantics": DataControllerID
                      "@ILM.ValueHelp.Path": /drm/valueHelp_orgAttribute_sap_capire_bookshop_LegalEntities
                      "@ILM.ValueHelp.Type": orgAttribute
                      "@ILM.ValueHelp.Entity": DPIRetentionService.valueHelp_orgAttribute_sap_capire_bookshop_LegalEntities
                      "@Common.Label": Legal entity
                  "@cds.drm.rootEntity": true
                  "@cds.api.ignore": true
                  query:
                    SELECT:
                      from:
                        ref:
                          - sap.capire.bookshop.Customers
                      columns:
                        - "*"
                        - ref:
                            - postalAddress
                            - endOfCustomer
                          as: postalAddress_endOfCustomer
                        - ref:
                            - legalEntity
                            - title
                          as: legalEntity_title
                      excluding:
                        - legalEntity
                  "@cds.redirection.target": true
                dataSubjectBaseURL: ~{srv-api/srv-url}
                dataSubjectBlockingEndPoint: /drm/dataSubjectBlocking
                dataSubjectInformationEndPoint: /drm/dataSubjectInformation
                dataSubjectsDestroyingEndPoint: /drm/dataSubjectsDestroying
            organizationAttributes:
              - organizationAttributeName: legalEntity_title
                organizationAttributeDescription: LegalEntity
                organizationAttributeBaseURL: ~{srv-api/srv-url}
                organizationAttributeValueHelpEndPoint: /drm/valueHelp_orgAttribute_sap_capire_bookshop_LegalEntities
  - name: bookshop-auditlog
    type: org.cloudfoundry.managed-service
    parameters:
      service: auditlog
      service-plan: oauth2
